<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    
    <div class="main-text">
      <h1><span>Royal</span> Clean</h1>
      <small>Sales Tracker</small>
    </div>

    <div class="inputs-container">

      <div>
        <label for="management">Management</label>
        <input type="text" id="management">
      </div>

      <div>
        <label type="text" for="branch">Branch</label>
        <input type="text" id="branch">
      </div>

      <div>
        <label for="voiceTotal">Total</label>
        <input type="number" id="invoiceTotal">
      </div>

      <div>
        <label for="voiceNumber">Voice Number</label>
        <input type="number" id="invoiceNumber">
      </div>

      <div>
        <label for="date">Date</label>
        <input type="date" id="date">
      </div>

      <div class="btns">
        <button class="add-btn" id="addBtn" onclick="addInvoice()">Add</button>
        <button class="delete-all-btn" id="btnDeleteAll" onclick="deleteAll()">Delete All</button>
      </div>
      
    </div>
    
    <div class="search">
      <input type="text" id="searchInput" placeholder="Search by Management or Invoice Number" oninput="searchInvoices(this.value)">
    </div>

    <table>

      <thead>
        <th class="id">ID</th>
        <th>Management</th>
        <th>branch</th>
        <th>Invoice Total</th>
        <th>Invoice Number</th>
        <th>Date</th>
        <th>Edite</th>
      </thead>

      <tbody id="tBody">
        
      </tbody>

      <tfoot>
        <th colspan="5">Totaly</th>
        <th colspan="2" id="totalSales"></th>
      </tfoot>

    </table>

  </div>
  <script src="js/main.js"></script>
  <script src="https://kit.fontawesome.com/70d93299bb.js" crossorigin="anonymous"></script>
</body>
</html>
